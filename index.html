<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danz Dashboard</title>
<style>
:root{
  --bg:#0b1120;--card:#111827;--card2:#172033;--text:#f8fafc;
  --muted:#94a3b8;--primary:#3b82f6;--green:#22c55e;
  --border:#263449;--danger:#ef4444;
}
*{box-sizing:border-box}
body{
  margin:0;background:linear-gradient(135deg,#0b1120,#111827);
  color:var(--text);font-family:Arial,sans-serif;min-height:100vh;
}
.container{width:min(1100px,94%);margin:auto;padding:28px 0 45px}
header{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;margin-bottom:25px;
}
h1{margin:0;font-size:28px}
.subtitle{color:var(--muted);margin-top:6px;font-size:14px}
.badge{
  background:#172033;border:1px solid var(--border);padding:9px 13px;
  border-radius:12px;color:#93c5fd;font-size:13px;
}
.toolbar{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;
}
input[type=search]{
  flex:1;min-width:200px;background:var(--card);color:white;
  border:1px solid var(--border);border-radius:12px;padding:13px 15px;
  outline:none;
}
button{
  border:0;border-radius:12px;padding:12px 16px;font-weight:bold;
  cursor:pointer;color:white;background:var(--primary);
}
button:hover{filter:brightness(1.1)}
button.secondary{background:#334155}
button.danger{background:#7f1d1d}
.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:15px;
}
.card{
  background:rgba(17,24,39,.92);border:1px solid var(--border);
  border-radius:18px;padding:18px;transition:.2s;
}
.card:hover{transform:translateY(-3px);border-color:#3b82f6}
.icon{
  width:48px;height:48px;border-radius:14px;background:#1d4ed8;
  display:grid;place-items:center;font-size:22px;margin-bottom:14px;
}
.card h3{margin:0 0 7px;font-size:18px}
.card p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5}
.open{
  display:block;text-align:center;text-decoration:none;color:white;
  background:#2563eb;padding:11px;border-radius:10px;font-weight:bold;
}
.open:hover{background:#1d4ed8}
footer{text-align:center;color:#64748b;font-size:12px;margin-top:25px}
.empty{
  display:none;text-align:center;color:var(--muted);
  padding:40px;background:var(--card);border-radius:18px;
}
@media(max-width:600px){
  header{align-items:flex-start;flex-direction:column}
  h1{font-size:24px}
}
</style>
</head>
<body>

<div class="container">

<header>
  <div>
    <h1>📂 Danz Dashboard</h1>
    <div class="subtitle">Pusat untuk membuka semua program HTML di repository</div>
  </div>
  <div class="badge" id="count">0 Program</div>
</header>

<div class="toolbar">
  <input id="search" type="search" placeholder="🔍 Cari program...">
  <button class="secondary" onclick="openAll()">Buka Semua</button>
</div>

<div class="grid" id="programGrid"></div>
<div class="empty" id="empty">Program tidak ditemukan.</div>

<footer>
  Danz Dashboard • GitHub Pages
</footer>

</div>

<script>
/*
  DAFTAR PROGRAM
  --------------------------------
  Tambahkan file HTML kamu di sini.

  Contoh:
  {
    name: "Kalkulator",
    file: "kalkulator.html",
    icon: "🧮",
    description: "Kalkulator sederhana"
  }
*/

const programs = [
  {
    name: "Program 1",
    file: "danzfuture.html",
    icon: "📄",
    description: "Buka program HTML pertama."
  },
  {
    name: "Program 2",
    file: "program2.html",
    icon: "🖥️",
    description: "Buka program HTML kedua."
  },
  {
    name: "Kalkulator",
    file: "kalkulator.html",
    icon: "🧮",
    description: "Program kalkulator HTML."
  },
  {
    name: "Trading Simulator",
    file: "trading.html",
    icon: "📈",
    description: "Simulasi trading."
  },
  {
    name: "Pengaturan",
    file: "settings.html",
    icon: "⚙️",
    description: "Halaman pengaturan."
  }
];

const grid = document.getElementById("programGrid");
const search = document.getElementById("search");
const empty = document.getElementById("empty");
const count = document.getElementById("count");

function render(filter = "") {
  grid.innerHTML = "";

  const result = programs.filter(p =>
    p.name.toLowerCase().includes(filter.toLowerCase()) ||
    p.file.toLowerCase().includes(filter.toLowerCase()) ||
    p.description.toLowerCase().includes(filter.toLowerCase())
  );

  count.textContent = result.length + " Program";
  empty.style.display = result.length ? "none" : "block";

  result.forEach((p, index) => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="icon">${p.icon}</div>
      <h3>${p.name}</h3>
      <p>${p.description}</p>
      <a class="open" href="${p.file}">Buka Program →</a>
    `;

    grid.appendChild(card);
  });
}

function openAll() {
  programs.forEach(p => {
    window.open(p.file, "_blank");
  });
}

search.addEventListener("input", () => render(search.value));

render();
</script>

</body>
</html>
